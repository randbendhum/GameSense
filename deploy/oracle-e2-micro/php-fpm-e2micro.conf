; ==========================================================================
; PHP 8.3-FPM POOL + OPCACHE PARA ORACLE E2.1.MICRO (1/8 OCPU // 1GB RAM)
; Caminho na VM: /etc/php/8.3/fpm/pool.d/www.conf
; ==========================================================================

[www]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data

; Modo ondemand: consome 0MB de workers ociosos e cria até 4 processos sob tráfego
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Limites seguros por worker
php_admin_value[memory_limit] = 96M
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 64
php_admin_value[opcache.interned_strings_buffer] = 8
php_admin_value[opcache.max_accelerated_files] = 6000
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.jit] = 1255
php_admin_value[opcache.jit_buffer_size] = 16M


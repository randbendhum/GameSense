# ==========================================================================
# NGINX VIRTUAL HOST — GAMESENSE AI (SUBDOMÍNIO PRÓPRIO + ORACLE E2.1.MICRO)
# Caminho na VM: /etc/nginx/sites-available/gamesense.conf
# Substitua `gamesense.seudominio.com` pelo seu subdomínio real.
# ==========================================================================

server {
    listen 80;
    listen [::]:80;

    # SEU SUBDOMÍNIO PRÓPRIO (Aponte um registo DNS Tipo 'A' para o IP Público da VM Oracle)
    server_name gsense.humbertorandon.com 168.75.102.39 _;

    root /var/www/gamesense-ai/public;
    index index.php;

    charset utf-8;
    client_max_body_size 4M;

    # Compressão Gzip leve para economizar banda e entregar o CSS Grid instantaneamente
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Headers de Segurança Hardcore
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Entrega direta de CSS3 Puro e JS pelo Nginx (0% de uso do PHP-FPM)
    location ~* \.(?:css|js|ico|svg|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 45s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

